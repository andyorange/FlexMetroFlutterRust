[package]
name = "rust_lib_flex_metro"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
path = "native/src/lib.rs"

[dev-dependencies]
tempfile = "3.0"

[dependencies]
chrono = "0.4"
env_logger = "0.11.6"
flutter_rust_bridge = "2.11.0"
log = "0.4.22"
#flutter_rust_bridge = "=2.6.0"
once_cell = "1.20.2"
regex = "1.10.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_yaml = "0.9"
yaml-rust = "0.4.5"
